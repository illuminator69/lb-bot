name: docker

on:
  push:
    branches: [main]
    # A release tag (`v0.4.0`) also tags the image with that version, without
    # the `v` (`lb-bot:0.4.0`, as worbus-server.yml tags `worbus-server:0.4.0`).
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # `latest` moves on a push to main (what the NAS pulls) and on a
          # release tag; never on a pre-release tag (one with a `-`, v0.4.1-rc1).
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type != 'tag' || !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image as WEB_BUILD so /api/system/status can say
          # which commit is running; deploy.sh dev passes its own.
          build-args: |
            LB_BOT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
